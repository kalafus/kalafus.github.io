<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-itunes-app" content="app-id=6751428414">
    <link rel="canonical" href="https://apps.apple.com/us/app/marijuana-12-step-meetings/id6751428414">
    <link rel="stylesheet" href="../../Marijuana12StepMeetings/app-store.css">
    <title>Open MJ Meetings</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: Canvas;
        color: CanvasText;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        display: grid;
        gap: 18px;
      }

      h1 {
        margin: 0;
        font-size: 1.65rem;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: color-mix(in srgb, CanvasText 72%, Canvas);
        line-height: 1.45;
      }

      .actions {
        justify-items: start;
        display: grid;
        gap: 10px;
      }

      a {
        color: inherit;
      }

      .note {
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Open this meeting in MJ Meetings</h1>
      <p>If MJ Meetings is installed, Safari may show an Open button at the top of this page. Use that button to open this meeting in the app.</p>
      <div class="actions">
        <a class="app-store-badge" id="app-store" href="https://apps.apple.com/us/app/marijuana-12-step-meetings/id6751428414"><img src="../../Marijuana12StepMeetings/assets/download-on-the-app-store.svg" width="120" height="40" alt="Download Marijuana 12-Step Meetings on the App Store"></a>
      </div>
      <p class="note">No Open button? Install or update MJ Meetings from the App Store, then try the meeting link again.</p>
    </main>
  </body>
</html>
